name: Generate contribution snake

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ARYAKOMPALWAR
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      - name: Commit snake
        run: |
          git config user.name "Arya Kompalwar"
          git config user.email "aryakompalwar@gmail.com"
          git add dist/*.svg
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update contribution snake animation"
          git push
