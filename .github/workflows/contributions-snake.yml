name: Generate contribution snake

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: ARYAKOMPALWAR
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg
          # If you want the classic palette too, uncomment:
          # outputs: |
          #   dist/snake.svg
          #   dist/snake-dark.svg?palette=github-dark

      - name: Commit snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution snake animation"
          file_pattern: dist/*.svg
          commit_user_name: Arya Kompalwar
          commit_user_email: aryakompalwar@gmail.com
