<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111922"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea44f"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="moon" cx="75%" cy="30%" r="15%">
      <stop offset="0%" stop-color="#c9d1d9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c9d1d9" stop-opacity="0"/>
    </radialGradient>
    <style>
      .stars { fill: #c9d1d9; opacity: 0.3; }
      .star1 { animation: twinkle 3s ease-in-out infinite; }
      .star2 { animation: twinkle 4s ease-in-out infinite 1s; }
      .star3 { animation: twinkle 5s ease-in-out infinite 2s; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; transform-origin: center; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Moon glow -->
  <circle cx="900" cy="120" r="160" fill="url(#moon)"/>

  <!-- Stars -->
  <g class="stars">
    <circle cx="100" cy="80" r="1.5" class="star1"/>
    <circle cx="250" cy="150" r="1" class="star2"/>
    <circle cx="400" cy="60" r="1.5" class="star3"/>
    <circle cx="550" cy="180" r="1" class="star1"/>
    <circle cx="700" cy="90" r="1.5" class="star2"/>
    <circle cx="850" cy="200" r="1" class="star3"/>
    <circle cx="150" cy="250" r="1" class="star1"/>
    <circle cx="300" cy="320" r="1.5" class="star2"/>
    <circle cx="500" cy="280" r="1" class="star3"/>
    <circle cx="650" cy="350" r="1.5" class="star1"/>
    <circle cx="800" cy="300" r="1" class="star2"/>
    <circle cx="950" cy="250" r="1.5" class="star3"/>
    <circle cx="1050" cy="150" r="1" class="star1"/>
    <circle cx="1100" cy="300" r="1" class="star2"/>
    <circle cx="200" cy="120" r="0.8" class="star3"/>
    <circle cx="450" cy="220" r="0.8" class="star1"/>
    <circle cx="750" cy="150" r="0.8" class="star2"/>
    <circle cx="1000" cy="200" r="0.8" class="star3"/>
  </g>

  <!-- Grid lines -->
  <g stroke="#2ea44f" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Accent line -->
  <rect x="60" y="160" width="80" height="4" rx="2" fill="url(#accent)" class="pulse"/>

  <!-- Main content -->
  <text x="60" y="120" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="52" font-weight="700" fill="#f0f6fc" letter-spacing="2">
    ARYA KOMPALWAR
  </text>

  <text x="60" y="155" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="18" font-weight="400" fill="#8b949e" letter-spacing="1">
    Full Stack Developer — MERN / Next.js
  </text>

  <text x="60" y="185" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="14" font-weight="400" fill="#39d353" letter-spacing="0.5">
    Building robust full-stack apps with MERN &amp; Next.js
  </text>

  <!-- Decorative code brackets -->
  <text x="1050" y="220" font-family="monospace" font-size="100" fill="#2ea44f" opacity="0.15" font-weight="700">&lt;/&gt;</text>
  <text x="1000" y="310" font-family="monospace" font-size="60" fill="#39d353" opacity="0.1" font-weight="700">{ }</text>

  <!-- Bottom accent -->
  <rect x="60" y="370" width="1080" height="1" fill="url(#accent)" opacity="0.3"/>

  <!-- Corner dots -->
  <circle cx="60" cy="370" r="3" fill="#39d353"/>
  <circle cx="1140" cy="370" r="3" fill="#39d353"/>
</svg>
