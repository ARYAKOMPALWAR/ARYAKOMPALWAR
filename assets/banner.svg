<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111922"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea44f"/>
      <stop offset="100%" stop-color="#39d353"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="moon" cx="75%" cy="30%" r="15%">
      <stop offset="0%" stop-color="#c9d1d9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#c9d1d9" stop-opacity="0"/>
    </radialGradient>
    <style>
      .stars { fill: #c9d1d9; opacity: 0.4; }
      .star1 { animation: twinkle 2s ease-in-out infinite; }
      .star2 { animation: twinkle 3s ease-in-out infinite 0.5s; }
      .star3 { animation: twinkle 4s ease-in-out infinite 1s; }
      .star4 { animation: twinkle 3s ease-in-out infinite 1.5s; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .slide { animation: slide 3s ease-in-out infinite; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes slide {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(10px); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Moon glow -->
  <circle cx="900" cy="120" r="180" fill="url(#moon)"/>

  <!-- Animated stars -->
  <g class="stars">
    <circle cx="80" cy="60" r="2" class="star1"/>
    <circle cx="200" cy="140" r="1.5" class="star2"/>
    <circle cx="350" cy="50" r="2" class="star3"/>
    <circle cx="500" cy="170" r="1.5" class="star4"/>
    <circle cx="650" cy="80" r="2" class="star1"/>
    <circle cx="800" cy="190" r="1.5" class="star2"/>
    <circle cx="120" cy="240" r="1.5" class="star3"/>
    <circle cx="280" cy="310" r="2" class="star4"/>
    <circle cx="450" cy="270" r="1.5" class="star1"/>
    <circle cx="600" cy="340" r="2" class="star2"/>
    <circle cx="750" cy="290" r="1.5" class="star3"/>
    <circle cx="900" cy="240" r="2" class="star4"/>
    <circle cx="1000" cy="140" r="1.5" class="star1"/>
    <circle cx="1100" cy="290" r="2" class="star2"/>
    <circle cx="150" cy="110" r="1" class="star3"/>
    <circle cx="400" cy="210" r="1" class="star4"/>
    <circle cx="700" cy="140" r="1" class="star1"/>
    <circle cx="950" cy="190" r="1" class="star2"/>
  </g>

  <!-- Grid lines -->
  <g stroke="#2ea44f" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
    <line x1="1050" y1="0" x2="1050" y2="400"/>
  </g>

  <!-- Animated accent lines -->
  <rect x="60" y="155" width="120" height="3" rx="1.5" fill="url(#accent)" class="pulse"/>
  <rect x="60" y="195" width="80" height="2" rx="1" fill="#39d353" opacity="0.6" class="pulse" style="animation-delay: 0.5s;"/>

  <!-- Main title with glow -->
  <text x="60" y="130" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="56" font-weight="800" fill="#f0f6fc" letter-spacing="3" filter="url(#glow)">
    ARYA KOMPALWAR
  </text>

  <!-- Subtitle -->
  <text x="62" y="165" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="20" font-weight="400" fill="#8b949e" letter-spacing="1">
    Full Stack Developer — MERN / Next.js
  </text>

  <!-- Tagline with slide animation -->
  <text x="62" y="198" font-family="'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" font-size="15" font-weight="500" fill="#39d353" letter-spacing="0.5" class="slide">
    Building robust full-stack apps with MERN &amp; Next.js
  </text>

  <!-- Decorative code brackets -->
  <text x="1020" y="200" font-family="monospace" font-size="90" fill="#2ea44f" opacity="0.12" font-weight="700">&lt;/&gt;</text>
  <text x="980" y="300" font-family="monospace" font-size="70" fill="#39d353" opacity="0.08" font-weight="700">{ }</text>

  <!-- Bottom accent line -->
  <rect x="60" y="370" width="1080" height="1" fill="url(#accent)" opacity="0.4"/>

  <!-- Corner accents -->
  <circle cx="60" cy="370" r="4" fill="#39d353" class="pulse"/>
  <circle cx="1140" cy="370" r="4" fill="#39d353" class="pulse" style="animation-delay: 1s;"/>

  <!-- Floating particles -->
  <circle cx="500" cy="100" r="2" fill="#39d353" opacity="0.6" class="star1"/>
  <circle cx="700" cy="250" r="1.5" fill="#2ea44f" opacity="0.5" class="star2"/>
  <circle cx="850" cy="180" r="2" fill="#39d353" opacity="0.4" class="star3"/>
</svg>
